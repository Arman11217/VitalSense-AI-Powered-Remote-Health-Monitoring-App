name: vitalsense
description: "VitalSense - AI-Powered Remote Health Monitoring and Disease Prediction System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# ──────────────────────── Dependencies ────────────────────────
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management & DI ──
  flutter_riverpod: ^2.5.1

  # ── Firebase Suite ──
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.3

  # ── Routing ──
  go_router: ^14.2.7

  # ── UI & Theming ──
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # ── Charts & Visualization ──
  fl_chart: ^0.69.0
  percent_indicator: ^4.0.1

  # ── Utilities ──
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  logger: ^2.4.0
  url_launcher: ^6.3.1

  # ── Notifications & Alerts ──
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0

  # ── PDF & File Export ──
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

# ──────────────────────── App Branding ────────────────────────
# Use the existing app logo at assets/images/app_logo.png as the
# launcher icon source, then run:
#   dart run flutter_launcher_icons
# This will generate ic_launcher.png for all Android mipmap densities
# and replace web/icons/Icon-*.png automatically.
flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  adaptive_icon_background: "#0175C2"
  adaptive_icon_foreground: "assets/images/app_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

  # Poppins font is loaded at runtime via google_fonts package
  # (see core/theme/app_theme.dart), so no static asset entries are needed.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
